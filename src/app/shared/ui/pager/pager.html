@if (totalPages() > 1) {
  <nav aria-label="Paginación" class="mt-6 flex items-center justify-center gap-3">
    <button
      type="button"
      [disabled]="page() === 1"
      (click)="pageChange.emit(page() - 1)"
      class="rounded-(--radius-card) border border-line px-3 py-1.5 text-sm disabled:opacity-40"
    >
      Anterior
    </button>
    <span class="text-sm text-muted">Página {{ page() }} de {{ totalPages() }}</span>
    <button
      type="button"
      [disabled]="page() === totalPages()"
      (click)="pageChange.emit(page() + 1)"
      class="rounded-(--radius-card) border border-line px-3 py-1.5 text-sm disabled:opacity-40"
    >
      Siguiente
    </button>
  </nav>
}
