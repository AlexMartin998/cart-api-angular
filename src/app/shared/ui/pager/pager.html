@if (totalPages() > 1) {
  <nav aria-label="Paginación" class="mt-8 flex items-center justify-center gap-3">
    <button
      type="button"
      [disabled]="page() === 1"
      (click)="pageChange.emit(page() - 1)"
      class="min-h-11 cursor-pointer rounded-(--radius-card) border border-control px-4 text-sm outline-offset-2 transition-colors duration-200 hover:border-ink hover:bg-ink/5 focus-visible:outline-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-40"
    >
      Anterior
    </button>
    <span class="amount text-sm text-muted">Página {{ page() }} de {{ totalPages() }}</span>
    <button
      type="button"
      [disabled]="page() === totalPages()"
      (click)="pageChange.emit(page() + 1)"
      class="min-h-11 cursor-pointer rounded-(--radius-card) border border-control px-4 text-sm outline-offset-2 transition-colors duration-200 hover:border-ink hover:bg-ink/5 focus-visible:outline-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-40"
    >
      Siguiente
    </button>
  </nav>
}
