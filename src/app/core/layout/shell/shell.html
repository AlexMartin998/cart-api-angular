<div class="flex min-h-dvh flex-col">
  <header class="border-b border-line bg-surface">
    <div class="mx-auto flex w-full max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
      <a
        routerLink="/productos"
        class="text-display mr-auto rounded-sm text-lg outline-offset-4 focus-visible:outline-2 focus-visible:outline-accent"
        >Shop</a
      >

      <nav
        aria-label="Principal"
        class="order-3 flex w-full flex-wrap gap-1 sm:order-none sm:w-auto sm:flex-nowrap"
      >
        @for (item of links(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive
            #active="routerLinkActive"
            class="relative flex min-h-11 grow items-center justify-center px-3 text-sm whitespace-nowrap outline-offset-2 transition-colors duration-200 hover:text-ink focus-visible:outline-2 focus-visible:outline-accent sm:grow-0"
            [class.font-semibold]="active.isActive"
            [class.text-ink]="active.isActive"
            [class.text-muted]="!active.isActive"
          >
            {{ item.label }}
            @if (item.badge && itemCount() > 0) {
              <span
                class="amount ml-1.5 inline-block bg-ink px-1.5 text-xs font-semibold text-white"
                [attr.aria-label]="itemCount() + ' artículos en el carrito'"
                >{{ itemCount() }}</span
              >
            }
            <span
              aria-hidden="true"
              class="absolute inset-x-2 bottom-0.5 h-0.5 bg-ink"
              [class.invisible]="!active.isActive"
            ></span>
          </a>
        }
      </nav>

      @if (user(); as signedIn) {
        <span class="hidden text-sm text-muted sm:inline">{{ signedIn.fullName }}</span>
      }

      <button
        type="button"
        (click)="signOut()"
        class="min-h-11 cursor-pointer rounded-(--radius-card) border border-control px-3 text-sm font-medium outline-offset-2 transition-colors duration-200 hover:border-ink hover:bg-ink/5 focus-visible:outline-2 focus-visible:outline-accent"
      >
        Salir
      </button>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8">
    <router-outlet />
  </main>
</div>
